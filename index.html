<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A weekly training system built for heart health and joints that last.">
<meta name="theme-color" content="#06080f">
<meta name="color-scheme" content="dark">
<title>Training Blueprint</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06080f;
  --surface: #0d111c;
  --surface-2: #121828;
  --line: #1e2638;
  --text: #e7ebf5;
  --muted: #8a94ab;
  --soft: #b9c2d6;
  --strength: #38bdf8;
  --cardio: #fb7185;
  --recovery: #a3e635;
  --accent: #fbbf24;
  --radius: 18px;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(56px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  color: var(--text);
  font: 15px/1.55 Inter, system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(900px 420px at 0% -10%, rgb(56 189 248 / .13), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgb(251 113 133 / .10), transparent 60%),
    linear-gradient(rgb(130 160 220 / .05) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgb(130 160 220 / .05) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--bg);
  -webkit-tap-highlight-color: transparent;
}

button {
  appearance: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: inherit;
  cursor: pointer;
}

button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }

.wrap { max-width: 1040px; margin: 0 auto; }

.ic {
  width: 1em;
  height: 1em;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Header */
.hero { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; }
.logo {
  display: grid;
  place-items: center;
  flex: none;
  width: 60px;
  height: 60px;
  border-radius: 18px;
  font-size: 30px;
  color: var(--cardio);
  background: linear-gradient(145deg, rgb(251 113 133 / .25), rgb(56 189 248 / .12));
  border: 1px solid rgb(251 113 133 / .35);
  box-shadow: 0 0 40px rgb(251 113 133 / .22);
}
.logo .ic { animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%, 30%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } }
h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); line-height: 1.05; font-weight: 800; letter-spacing: -1.2px; }
.lead { margin: 4px 0 0; color: var(--muted); }

/* Sections */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 34px 0 12px;
  font: 500 12px var(--mono);
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
.label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Mood */
.mood h2 { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.mood h2 .ic { color: var(--accent); }
.moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mood-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-height: 84px;
  padding: 14px 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  transition: border-color .2s, background .2s, color .2s;
}
.mood-btn .ic { font-size: 26px; color: var(--text); }
.mood-btn[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgb(251 191 36 / .08); }
.mood-btn[aria-pressed="true"] .ic { color: var(--accent); }
.pick { margin: 12px 0 0; min-height: 22px; font-size: 14px; color: var(--muted); }
.pick b { color: var(--accent); font-weight: 600; }

/* Expandable */
.toggle { display: flex; align-items: center; gap: 14px; width: 100%; }
.chev { margin-left: auto; font-size: 18px; color: var(--muted); transition: transform .25s; }
[aria-expanded="true"] .chev { transform: rotate(180deg); }
.body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.open > .body { grid-template-rows: 1fr; }
.body > div { overflow: hidden; }

/* Sessions */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.card {
  --a: var(--strength);
  position: relative;
  overflow: hidden;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  transition: opacity .25s, box-shadow .25s, border-color .25s;
}
.card.cardio { --a: var(--cardio); }
.card.recovery { --a: var(--recovery); }
.card::after {
  content: "";
  position: absolute;
  top: -40px;
  right: -40px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--a) 20%, transparent), transparent 70%);
  pointer-events: none;
}
.card.match { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 40px rgb(251 191 36 / .12); }
.card.fade { opacity: .32; }
.tile {
  display: grid;
  place-items: center;
  flex: none;
  width: 50px;
  height: 50px;
  border-radius: 15px;
  font-size: 26px;
  color: var(--a);
  background: color-mix(in srgb, var(--a) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--a) 30%, transparent);
}
.card .toggle { position: relative; z-index: 1; }
.card small { display: block; font: 500 11px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--a); }
.card strong { display: block; font-size: 17px; font-weight: 600; line-height: 1.25; }
.meter { display: flex; gap: 3px; margin-top: 7px; }
.meter i { width: 12px; height: 5px; border-radius: 2px; background: var(--line); }
.meter i.on { background: var(--a); }
.detail { position: relative; z-index: 1; padding-top: 14px; font-size: 14px; }
.detail ul { margin: 0; padding: 0; list-style: none; }
.detail li { position: relative; padding: 5px 0 5px 16px; border-bottom: 1px dashed var(--line); }
.detail li::before { content: ""; position: absolute; left: 0; top: 13px; width: 6px; height: 6px; border-radius: 2px; background: var(--a); }
.examples { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--a) 8%, transparent); }
.examples span { display: block; margin-bottom: 2px; font: 500 10px var(--mono); letter-spacing: 1.5px; color: var(--a); }
.examples p { margin: 0; color: var(--text); }
.why { margin: 12px 0 0; color: var(--soft); }
.tag { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; font: 500 11px var(--mono); }
.tag.ok { color: var(--recovery); }
.tag.no { color: var(--cardio); }

/* Rules and habits */
.split { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; }
.rule { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rule:first-child { padding-top: 0; }
.rule:last-child { padding-bottom: 0; border: 0; }
.rule .tile { --a: var(--accent); width: 36px; height: 36px; border-radius: 11px; font-size: 18px; }
.rule b { display: block; font-size: 14px; font-weight: 600; }
.rule span { font-size: 13px; color: var(--muted); }
.habits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
.habit { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.habit .ic { font-size: 22px; color: var(--strength); }
.habit b { display: block; margin-top: 6px; font-size: 21px; font-weight: 800; }
.habit small { color: var(--muted); font-size: 12px; }

.step { position: absolute; top: 14px; right: 46px; z-index: 1; font: 500 11px var(--mono); color: var(--muted); }

/* Remember */
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.note { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.note .tile { --a: var(--accent); width: 42px; height: 42px; border-radius: 12px; font-size: 21px; }
.note strong { display: block; font-size: 16px; font-weight: 600; }
.note small { color: var(--muted); font-size: 12px; }
.note ul { margin: 0; padding: 12px 0 0; list-style: none; }
.note li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.note li b { display: block; font-weight: 600; }
.note li span { color: var(--soft); }

@media (max-width: 760px) {
  .moods { grid-template-columns: repeat(2, 1fr); }
  .split { grid-template-columns: 1fr; }
  .grid, .notes { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<main class="wrap">
  <header class="hero">
    <div class="logo"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></div>

  <section class="panel mood" aria-labelledby="mood-title">

  <h2 class="label">Sessions · in order</h2>

  <div class="split">
    <div class="panel" id="rules"></div>
    <div class="habits" id="habits"></div>

</main>

      ['Find your real max heart rate', 'Use your highest number from a very hard effort. Age formulas are often wrong.'],
      ['Walking is not enough', 'Walking builds the base. Only hard intervals raise your fitness ceiling.'],
      ['Test every 2–3 months', 'Run a 5k, or repeat the same interval session.'],
      ['Check with a doctor', 'Blood pressure and blood fats (ApoB), every 1–2 years.']
    ]
  },
  {
    icon: 'rotate', title: 'Mobility', items: [
      ['10 minutes a day', 'Ankles, hips, upper back, wrists, dead hang.'],
      ['Strength through full range', 'Deep, slow reps give you mobility you can use.'],
      ['When to stretch', 'Before training: just move. Long stretches: after training or at night.'],
      ['Both sides', 'Padel is one-sided. Stretch and train both sides.']
    ]
  },
  {
    icon: 'racket', title: 'Padel', items: [
      ['Warm up 10 minutes', 'Most injuries happen when cold: calf, ankle, elbow.'],
      ['Strong forearms', 'Grip and wrist work protect the elbow.']
    ]
  },
  {
    icon: 'repeat', title: 'Recovery', items: [
      ['Same sleep times', 'Go to bed and wake up at the same time, within 30 min.'],
      ['Stand up often', 'When you sit, move every 30–60 min.'],
      ['No big jumps', 'Keep each week close to the last one.'],
      ['HRV: look at the week', 'One bad morning means little. A bad week means rest.'],
      ['Easy week', 'Every 5–6 weeks, do half the sets.'],
      ['Busy week', 'Only do Legs, one upper day, Intervals and Long easy.']
    ]
  }
];

const TYPES = { strength: 'Strength', cardio: 'Cardio', recovery: 'Recovery' };
const $ = (selector) => document.querySelector(selector);
const icon = (name) => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const meter = (load) => `<span class="meter" aria-label="Load ${load} of 5">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= load ? 'on' : ''}"></i>`).join('')}</span>`;

function parkTag(park) {
  if (park === undefined) return '';
  return park
    ? `<span class="tag ok">${icon('trees')}Park workout OK</span>`
    : `<span class="tag no">${icon('x')}Gym only</span>`;
}

function expandable(id, head, body) {
  return `
    <button class="toggle" aria-expanded="false" aria-controls="${id}">${head}<span class="chev">${icon('chev')}</span></button>
    <div class="body" id="${id}" inert><div>${body}</div></div>`;
}

function renderSessions() {
  $('#sessions').innerHTML = sessions.map((s, i) => `
    <article class="card ${s.type}" data-moods="${s.moods.join(' ')}">
      <span class="step">${String(i + 1).padStart(2, '0')}</span>
      ${expandable(`session-${i}`, `
        <span class="tile">${icon(s.icon)}</span>
        <span><small>${TYPES[s.type]} · ${s.time}</small><strong>${s.name}</strong>${meter(s.load)}</span>`, `
        <div class="detail">
          <ul>${s.steps.map((step) => `<li>${step}</li>`).join('')}</ul>
          <div class="examples"><span>EXAMPLE</span>${s.examples.map((e) => `<p>${e}</p>`).join('')}</div>
          <p class="why">${s.why}</p>
          ${parkTag(s.park)}
        </div>`)}
    </article>`).join('');
}

function renderNotes() {
  $('#notes').innerHTML = notes.map((n, i) => `
    <article class="note">
      ${expandable(`note-${i}`, `
        <span class="tile">${icon(n.icon)}</span>
        <span><strong>${n.title}</strong><small>${n.items.length} tips</small></span>`, `
        <ul>${n.items.map(([title, text]) => `<li><b>${title}</b><span>${text}</span></li>`).join('')}</ul>`)}
    </article>`).join('');
}

function setMood(id) {
  document.querySelectorAll('.mood-btn').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mood === id));
  document.querySelectorAll('.card').forEach((card) => {
    const match = Boolean(id) && card.dataset.moods.split(' ').includes(id);
    card.classList.toggle('match', match);
    card.classList.toggle('fade', Boolean(id) && !match);
  });
  const picks = sessions.filter((s) => s.moods.includes(id)).map((s) => s.name);
  $('#pick').innerHTML = id ? `Good today: <b>${picks.join(' · ')}</b>` : 'Tap one. Matching sessions light up.';
}

$('#moods').innerHTML = moods.map((m) => `<button class="mood-btn" data-mood="${m.id}" aria-pressed="false">${icon(m.icon)}${m.label}</button>`).join('');
$('#rules').innerHTML = rules.map((r) => `<div class="rule"><span class="tile">${icon(r.icon)}</span><div><b>${r.title}</b><span>${r.text}</span></div></div>`).join('');
$('#habits').innerHTML = habits.map((h) => `<div class="habit">${icon(h.icon)}<b>${h.value}</b><small>${h.label}</small></div>`).join('');
renderSessions();
renderNotes();
setMood(null);

let mood = null;
$('#moods').addEventListener('click', (e) => {
  const btn = e.target.closest('.mood-btn');
  if (!btn) return;
  mood = mood === btn.dataset.mood ? null : btn.dataset.mood;
  setMood(mood);
});

document.addEventListener('click', (e) => {
  const toggle = e.target.closest('.toggle');
  if (!toggle) return;
  const open = toggle.getAttribute('aria-expanded') !== 'true';
  toggle.setAttribute('aria-expanded', open);
  toggle.parentElement.classList.toggle('open', open);
  document.getElementById(toggle.getAttribute('aria-controls')).inert = !open;
});
</script>
</body>
</html>
